<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transcription Viewer</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1f; --muted: #6b6b70; --line: #d9d9de;
  --grid: rgba(0,0,0,.06); --beat: rgba(0,0,0,.14); --down: rgba(0,0,0,.42);
  --note0: #2f6fdf; --note1: #d9822b; --play: #e0245e; --ref: #0b8a5a; --warn: #e0245e;
  --chordA: #eef1f8; --chordB: #e3e8f3; --keyA: #f3eee4; --keyB: #ebe3d3; --black-key: rgba(0,0,0,.035);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151517; --panel: #1e1e21; --text: #ececf0; --muted: #9a9aa3; --line: #34343a;
    --grid: rgba(255,255,255,.05); --beat: rgba(255,255,255,.14); --down: rgba(255,255,255,.45);
    --note0: #6aa1ff; --note1: #f0a24f; --play: #ff4f86; --ref: #3fd09a; --warn: #ff4f86;
    --chordA: #252a35; --chordB: #2c3240; --keyA: #2f2a22; --keyB: #383126; --black-key: rgba(255,255,255,.03);
  }
}
:root[data-theme="dark"] {
  --bg: #151517; --panel: #1e1e21; --text: #ececf0; --muted: #9a9aa3; --line: #34343a;
  --grid: rgba(255,255,255,.05); --beat: rgba(255,255,255,.14); --down: rgba(255,255,255,.45);
  --note0: #6aa1ff; --note1: #f0a24f; --play: #ff4f86; --ref: #3fd09a; --warn: #ff4f86;
  --chordA: #252a35; --chordB: #2c3240; --keyA: #2f2a22; --keyB: #383126; --black-key: rgba(255,255,255,.03);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", "Yu Gothic UI", sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
h1 { font-size: 15px; margin: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40ch; }
button { font: inherit; padding: 4px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); cursor: pointer; }
button:hover { border-color: var(--muted); }
label { display: inline-flex; gap: 4px; align-items: center; color: var(--muted); cursor: pointer; user-select: none; }
.time { font-variant-numeric: tabular-nums; min-width: 12ch; }
#status { padding: 6px 16px; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 1.4em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#status b { color: var(--text); font-weight: 600; }
.wrap { padding: 0 16px 16px; }
canvas { display: block; width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
#main { cursor: crosshair; touch-action: none; }
#overview { margin-top: 8px; cursor: pointer; }
.legend { margin-top: 8px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 16px; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <button id="play">▶ 再生</button>
  <span class="time" id="time">0:00.0</span>
  <label><input type="checkbox" id="click"> クリック音</label>
  <label><input type="checkbox" id="synth"> メロディ音</label>
  <label><input type="checkbox" id="follow" checked> 追従</label>
  <label id="refBox" hidden><input type="checkbox" id="ref" checked> 参照ラベル</label>
  <label>拡大 <input type="range" id="zoom" min="20" max="600" value="120"></label>
</header>
<div id="status"></div>
<div class="wrap">
  <canvas id="main"></canvas>
  <canvas id="overview"></canvas>
  <div class="legend" id="legend"></div>
</div>
<audio id="audio" preload="auto"></audio>
<script>
const DATA = /*DATA*/null;

// ------------------------------------------------------------------ setup
const audio = document.getElementById("audio");
const main = document.getElementById("main"), overview = document.getElementById("overview");
const $ = id => document.getElementById(id);
const NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
const BLACK = new Set([1, 3, 6, 8, 10]);
const GUTTER = 64;
const ref = DATA.reference;
document.title = DATA.title;
$("title").textContent = DATA.title;
$("title").title = DATA.title;
audio.src = DATA.audio.startsWith("data:") ? DATA.audio : DATA.audio.split("/").map(encodeURIComponent).join("/");
if (ref) $("refBox").hidden = false;

const beatTimes = DATA.beats.map(b => b[0]);
const noteStarts = DATA.notes.map(n => n[0]);
const pitches = DATA.notes.map(n => n[2]);
const lowPitch = pitches.length ? Math.min(...pitches) - 2 : 55, highPitch = pitches.length ? Math.max(...pitches) + 2 : 80;

// Bar colour by its number of beats; the same colour means the same bar length.
const HUES = [0, 0, 300, 190, 215, 40, 275, 0, 160, 330, 60, 250, 100];
const countColor = (n, alpha) => n <= 1 || n > 12 ? `hsla(0, 0%, 60%, ${alpha})` : `hsla(${HUES[n]}, 65%, 55%, ${alpha})`;
const meterText = m => m ? `${m[0]}/${m[1]}` : "";
const fmt = t => `${Math.floor(t / 60)}:${(t % 60).toFixed(1).padStart(4, "0")}`;
const noteName = p => NAMES[p % 12] + (Math.floor(p / 12) - 1);

function lowerBound(array, value) {
  let lo = 0, hi = array.length;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (array[mid] < value) lo = mid + 1; else hi = mid; }
  return lo;
}
function segmentAt(list, t, start = s => s[0]) {
  let lo = 0, hi = list.length - 1, found = -1;
  while (lo <= hi) { const mid = (lo + hi) >> 1; if (start(list[mid]) <= t) { found = mid; lo = mid + 1; } else hi = mid - 1; }
  return found;
}

// ------------------------------------------------------------------ view
let pps = +$("zoom").value, t0 = 0, hoverT = null;
let css = {};
function readColors() {
  const s = getComputedStyle(document.documentElement);
  for (const k of ["panel", "text", "muted", "line", "grid", "beat", "down", "note0", "note1", "play", "ref", "warn", "chordA", "chordB", "keyA", "keyB", "black-key"])
    css[k] = s.getPropertyValue("--" + k).trim();
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { readColors(); draw(); });

function lanes() {
  const rows = [["ruler", 18], ["section", 18], ["key", 18], ["bars", 26]];
  if (ref && $("ref").checked) rows.push(["refBars", 22]);
  rows.push(["chord", 26], ["beats", 22]);
  const out = {}; let y = 0;
  for (const [name, h] of rows) { out[name] = [y, h]; y += h; }
  out.roll = [y, Math.max(240, main.clientHeight - y)];
  return out;
}
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const height = Math.max(520, window.innerHeight - main.getBoundingClientRect().top - 110);
  main.style.height = height + "px";
  overview.style.height = (ref && $("ref").checked ? 44 : 30) + "px";
  for (const c of [main, overview]) { c.width = c.clientWidth * dpr; c.height = c.clientHeight * dpr; c.getContext("2d").setTransform(dpr, 0, 0, dpr, 0, 0); }
  draw();
}
const x = t => GUTTER + (t - t0) * pps;
const tAt = px => t0 + (px - GUTTER) / pps;
const viewSeconds = () => (main.clientWidth - GUTTER) / pps;

function box(ctx, x0, x1, y, h, fill, text, color) {
  const left = Math.max(x0, GUTTER), right = Math.min(x1, main.clientWidth);
  if (right <= left) return;
  ctx.fillStyle = fill; ctx.fillRect(left, y + 1, right - left - 1, h - 2);
  if (text && right - left > 14) {
    ctx.save(); ctx.beginPath(); ctx.rect(left, y, right - left - 2, h); ctx.clip();
    ctx.fillStyle = color || css.text; ctx.fillText(text, left + 3, y + h / 2 + 1); ctx.restore();
  }
}

function draw() {
  const ctx = main.getContext("2d"), W = main.clientWidth, H = main.clientHeight, L = lanes();
  const tEnd = tAt(W), now = audio.currentTime;
  ctx.clearRect(0, 0, W, H);
  ctx.font = "11px system-ui, sans-serif"; ctx.textBaseline = "middle";

  // piano roll background
  const [ry, rh] = L.roll, span = highPitch - lowPitch + 1, row = rh / span;
  const yOf = p => ry + (highPitch - p) * row;
  for (let p = lowPitch; p <= highPitch; p++) {
    if (BLACK.has(((p % 12) + 12) % 12)) { ctx.fillStyle = css["black-key"]; ctx.fillRect(GUTTER, yOf(p), W - GUTTER, row); }
    if (p % 12 === 0) {
      ctx.fillStyle = css.grid; ctx.fillRect(GUTTER, yOf(p) + row, W - GUTTER, 1);
      ctx.fillStyle = css.muted; ctx.fillText(noteName(p), 6, yOf(p) + row / 2);
    }
  }

  // beat and downbeat lines through the lanes below the bars
  const lineTop = L.bars[0];
  for (let i = lowerBound(beatTimes, t0 - 1); i < beatTimes.length && beatTimes[i] <= tEnd; i++) {
    const [t, down] = DATA.beats[i], bx = Math.round(x(t)) + .5;
    if (bx < GUTTER) continue;
    ctx.strokeStyle = down ? css.down : css.beat; ctx.lineWidth = down ? 1.5 : 1;
    ctx.beginPath(); ctx.moveTo(bx, down ? lineTop : L.chord[0]); ctx.lineTo(bx, H); ctx.stroke();
  }
  ctx.lineWidth = 1;

  // ruler
  const step = [1, 2, 5, 10, 15, 30, 60].find(s => s * pps >= 60) || 60;
  ctx.fillStyle = css.muted;
  for (let t = Math.ceil(t0 / step) * step; t <= tEnd; t += step) { ctx.fillRect(x(t), 12, 1, 6); ctx.fillText(fmt(t).replace(/\.0$/, ""), x(t) + 3, 8); }

  // sections, keys, chords
  DATA.sections.forEach((s, i) => {
    const end = i + 1 < DATA.sections.length ? DATA.sections[i + 1][0] : DATA.duration;
    if (end >= t0 && s[0] <= tEnd) box(ctx, x(s[0]), x(end), L.section[0], L.section[1], i % 2 ? css.keyA : css.keyB, s[1]);
  });
  DATA.keys.forEach((k, i) => { if (k[1] >= t0 && k[0] <= tEnd) box(ctx, x(k[0]), x(k[1]), L.key[0], L.key[1], i % 2 ? css.keyB : css.keyA, k[2]); });
  DATA.chords.forEach((c, i) => { if (c[1] >= t0 && c[0] <= tEnd) box(ctx, x(c[0]), x(c[1]), L.chord[0], L.chord[1], i % 2 ? css.chordB : css.chordA, c[2]); });

  // predicted bars: colour = number of beats; red outline = length disagrees with the meter token
  DATA.bars.forEach((b, i) => {
    if (b.end < t0 || b.start > tEnd) return;
    const [y, h] = L.bars, inner = i > 0 && i < DATA.bars.length - 1;
    const label = `${i + 1}  ${b.beats}拍` + (b.meter_token || i === 0 || x(b.start) < GUTTER ? `  ${meterText(b.meter)}` : "");
    box(ctx, x(b.start), x(b.end), y, h, countColor(b.beats, .35), label);
    if (inner && b.meter && b.beats !== b.meter[0]) {
      ctx.strokeStyle = css.warn; ctx.strokeRect(Math.max(x(b.start), GUTTER) + .5, y + 1.5, x(b.end) - Math.max(x(b.start), GUTTER) - 2, h - 3);
    }
  });

  // reference bars
  if (ref && $("ref").checked) {
    const [y, h] = L.refBars;
    ref.bars.forEach((b, i) => {
      const end = b.end ?? DATA.duration;
      if (end < t0 || b.start > tEnd) return;
      box(ctx, x(b.start), x(end), y, h, countColor(b.meter[0], .25), `${i + 1}  ${meterText(b.meter)}`);
      ctx.fillStyle = css.ref; ctx.fillRect(x(b.start), y + 1, 2, h - 2);
    });
  }

  // beat ticks: prediction on top, reference below
  const [by, bh] = L.beats;
  for (let i = lowerBound(beatTimes, t0); i < beatTimes.length && beatTimes[i] <= tEnd; i++) {
    const [t, down] = DATA.beats[i];
    ctx.fillStyle = css.text; ctx.fillRect(x(t) - (down ? 1.5 : .5), by + 2, down ? 3 : 1, down ? bh / 2 - 2 : bh / 3);
  }
  if (ref && $("ref").checked) {
    ctx.fillStyle = css.ref;
    for (const t of ref.beats) if (t >= t0 && t <= tEnd) ctx.fillRect(x(t) - .5, by + bh / 2 + 2, 1, bh / 3);
    for (const b of ref.bars) if (b.start >= t0 && b.start <= tEnd) ctx.fillRect(x(b.start) - 1.5, by + bh / 2 + 2, 3, bh / 2 - 4);
  }

  // notes
  for (let i = Math.max(0, lowerBound(noteStarts, t0 - 8)); i < DATA.notes.length && noteStarts[i] <= tEnd; i++) {
    const [s, e, p, track] = DATA.notes[i];
    if (e < t0) continue;
    const left = Math.max(x(s), GUTTER), right = x(e);
    if (right <= left) continue;
    const active = s <= now && now < e;
    ctx.fillStyle = track ? css.note1 : css.note0; ctx.globalAlpha = active ? 1 : .8;
    ctx.fillRect(left, yOf(p) + .5, Math.max(2, right - left - 1), Math.max(2, row - 1));
    if (active) { ctx.strokeStyle = css.text; ctx.strokeRect(left + .5, yOf(p) + 1, Math.max(2, right - left - 1), Math.max(2, row - 1)); }
  }
  ctx.globalAlpha = 1;

  // lane names
  ctx.fillStyle = css.panel; ctx.fillRect(0, 0, GUTTER, L.roll[0]);
  ctx.fillStyle = css.muted;
  const names = { section: "構成", key: "キー", bars: "小節", refBars: "参照", chord: "コード", beats: "拍" };
  for (const [name, text] of Object.entries(names)) if (L[name]) ctx.fillText(text, 6, L[name][0] + L[name][1] / 2);
  ctx.fillStyle = css.line;
  for (const name of Object.keys(names)) if (L[name]) ctx.fillRect(0, L[name][0] + L[name][1] - 1, W, 1);
  ctx.fillRect(GUTTER - 1, 0, 1, H);

  // playhead and hover
  if (now >= t0 && now <= tEnd) { ctx.fillStyle = css.play; ctx.fillRect(x(now) - 1, 0, 2, H); }
  if (hoverT !== null) { ctx.fillStyle = css.muted; ctx.globalAlpha = .5; ctx.fillRect(x(hoverT), 0, 1, H); ctx.globalAlpha = 1; }

  drawOverview(); status();
}

function drawOverview() {
  const ctx = overview.getContext("2d"), W = overview.clientWidth, H = overview.clientHeight, sx = W / DATA.duration;
  const showRef = ref && $("ref").checked, h = showRef ? H / 2 : H;
  ctx.clearRect(0, 0, W, H);
  for (const b of DATA.bars) { ctx.fillStyle = countColor(b.beats, .75); ctx.fillRect(b.start * sx, 0, Math.max(1, (b.end - b.start) * sx - .5), h - 1); }
  if (showRef) for (const b of ref.bars) { ctx.fillStyle = countColor(b.meter[0], .55); ctx.fillRect(b.start * sx, h, Math.max(1, ((b.end ?? DATA.duration) - b.start) * sx - .5), h); }
  ctx.strokeStyle = css.text; ctx.strokeRect(t0 * sx + .5, .5, viewSeconds() * sx, H - 1);
  ctx.fillStyle = css.play; ctx.fillRect(audio.currentTime * sx - 1, 0, 2, H);
}

function status() {
  const t = hoverT ?? audio.currentTime;
  $("time").textContent = `${fmt(audio.currentTime)} / ${fmt(DATA.duration)}`;
  const parts = [`<b>${fmt(t)}</b>`];
  const bi = segmentAt(DATA.bars, t, b => b.start);
  if (bi >= 0) { const b = DATA.bars[bi]; parts.push(`小節 ${bi + 1}: ${b.beats} 拍（拍子トークン ${meterText(b.meter)}）`); }
  if (ref && $("ref").checked) { const ri = segmentAt(ref.bars, t, b => b.start); if (ri >= 0) parts.push(`参照 ${ri + 1}: ${meterText(ref.bars[ri].meter)}`); }
  const ki = segmentAt(DATA.keys, t); if (ki >= 0) parts.push(`キー ${DATA.keys[ki][2]}`);
  const ci = segmentAt(DATA.chords, t); if (ci >= 0 && t < DATA.chords[ci][1]) parts.push(`コード <b>${DATA.chords[ci][2]}</b>`);
  const sounding = DATA.notes.filter(n => n[0] <= t && t < n[1]).map(n => noteName(n[2]));
  if (sounding.length) parts.push(`メロディ ${sounding.join(" ")}`);
  $("status").innerHTML = parts.join(" · ");
}

// ------------------------------------------------------------------ sound: clicks and melody
let actx = null, scheduledTo = 0;
function scheduleSounds() {
  if (!actx || audio.paused) return;
  const now = audio.currentTime, until = now + 0.25, rate = audio.playbackRate;
  const at = t => actx.currentTime + (t - now) / rate;
  if ($("click").checked)
    for (let i = lowerBound(beatTimes, scheduledTo); i < beatTimes.length && beatTimes[i] < until; i++) {
      const [t, down] = DATA.beats[i];
      const osc = actx.createOscillator(), gain = actx.createGain();
      osc.frequency.value = down ? 1760 : 1100;
      gain.gain.setValueAtTime(down ? .35 : .18, at(t)); gain.gain.exponentialRampToValueAtTime(.001, at(t) + .04);
      osc.connect(gain).connect(actx.destination); osc.start(at(t)); osc.stop(at(t) + .05);
    }
  if ($("synth").checked)
    for (let i = lowerBound(noteStarts, scheduledTo); i < DATA.notes.length && noteStarts[i] < until; i++) {
      const [s, e, p] = DATA.notes[i], start = at(s), end = at(Math.max(e, s + .05));
      const osc = actx.createOscillator(), gain = actx.createGain();
      osc.type = "triangle"; osc.frequency.value = 440 * 2 ** ((p - 69) / 12);
      gain.gain.setValueAtTime(0, start); gain.gain.linearRampToValueAtTime(.12, start + .01);
      gain.gain.setValueAtTime(.12, Math.max(start + .01, end - .03)); gain.gain.linearRampToValueAtTime(0, end);
      osc.connect(gain).connect(actx.destination); osc.start(start); osc.stop(end + .01);
    }
  scheduledTo = until;
}

// ------------------------------------------------------------------ interaction
function follow() {
  if ($("follow").checked && !audio.paused) {
    const view = viewSeconds();
    if (audio.currentTime < t0 || audio.currentTime > t0 + view * .7) t0 = Math.max(0, audio.currentTime - view * .3);
  }
}
function loop() { scheduleSounds(); follow(); draw(); if (!audio.paused) requestAnimationFrame(loop); }
function seek(t) { audio.currentTime = Math.min(Math.max(0, t), DATA.duration); scheduledTo = audio.currentTime; draw(); }
function toggle() {
  if (audio.paused) {
    actx = actx || new AudioContext(); actx.resume();
    scheduledTo = audio.currentTime;
    audio.play().catch(err => { $("status").textContent = "音声を再生できません: " + err.message + "（--embed-audio で作り直すと直ることがあります）"; });
  } else audio.pause();
}
audio.addEventListener("play", () => { $("play").textContent = "⏸ 停止"; requestAnimationFrame(loop); });
audio.addEventListener("pause", () => { $("play").textContent = "▶ 再生"; draw(); });
audio.addEventListener("seeked", () => { scheduledTo = audio.currentTime; });
audio.addEventListener("error", () => { $("status").textContent = "音声ファイルが読めません: " + DATA.audio; });
$("play").onclick = toggle;
for (const id of ["click", "synth"]) $(id).onchange = () => { scheduledTo = audio.currentTime; };
$("ref").onchange = resize;
$("zoom").oninput = () => { const center = t0 + viewSeconds() / 2; pps = +$("zoom").value; t0 = Math.max(0, center - viewSeconds() / 2); draw(); };

let drag = null;
main.addEventListener("pointerdown", e => { drag = { x: e.offsetX, t0, moved: false }; main.setPointerCapture(e.pointerId); });
main.addEventListener("pointermove", e => {
  hoverT = e.offsetX > GUTTER ? tAt(e.offsetX) : null;
  if (drag && Math.abs(e.offsetX - drag.x) > 3) { drag.moved = true; $("follow").checked = false; t0 = Math.max(0, drag.t0 - (e.offsetX - drag.x) / pps); }
  if (audio.paused) draw();
});
main.addEventListener("pointerup", e => { if (drag && !drag.moved && e.offsetX > GUTTER) seek(tAt(e.offsetX)); drag = null; });
main.addEventListener("pointerleave", () => { hoverT = null; if (audio.paused) draw(); });
main.addEventListener("wheel", e => {
  e.preventDefault();
  if (e.ctrlKey) {
    const anchor = tAt(e.offsetX);
    pps = Math.min(600, Math.max(20, pps * Math.exp(-e.deltaY * .002))); $("zoom").value = pps;
    t0 = Math.max(0, anchor - (e.offsetX - GUTTER) / pps);
  } else { $("follow").checked = false; t0 = Math.max(0, t0 + (e.deltaX || e.deltaY) / pps); }
  if (audio.paused) draw();
}, { passive: false });
function overviewSeek(e) { const t = e.offsetX / overview.clientWidth * DATA.duration; t0 = Math.max(0, t - viewSeconds() * .3); seek(t); }
overview.addEventListener("pointerdown", e => { overview.setPointerCapture(e.pointerId); overviewSeek(e); overview.onpointermove = overviewSeek; });
overview.addEventListener("pointerup", () => { overview.onpointermove = null; });
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" && e.target.type === "range") return;
  if (e.code === "Space") { e.preventDefault(); toggle(); }
  else if (e.code === "ArrowRight" || e.code === "ArrowLeft") {
    e.preventDefault();
    const i = segmentAt(DATA.bars, audio.currentTime + .05, b => b.start) + (e.code === "ArrowRight" ? 1 : -1);
    const bar = DATA.bars[Math.min(Math.max(i, 0), DATA.bars.length - 1)];
    seek(bar.start); if (bar.start < t0 || bar.start > t0 + viewSeconds()) t0 = Math.max(0, bar.start - viewSeconds() * .3); draw();
  }
});
window.addEventListener("resize", resize);

// legend: one swatch per bar length that occurs
const counts = [...new Set(DATA.bars.map(b => b.beats).concat(ref ? ref.bars.map(b => b.meter[0]) : []))].sort((a, b) => a - b);
$("legend").innerHTML =
  counts.map(n => `<span><span class="sw" style="background:${countColor(n, .75)}"></span>${n} 拍</span>`).join("") +
  `<span><span class="sw" style="background:var(--note0)"></span>メロディ track 0</span>` +
  `<span><span class="sw" style="background:var(--note1)"></span>track 1</span>` +
  `<span><span class="sw" style="border:1.5px solid var(--warn)"></span>拍数が拍子トークンと合わない小節</span>` +
  (ref ? `<span><span class="sw" style="background:var(--ref)"></span>参照ラベルの拍・小節頭</span>` : "") +
  `<span>クリック: 移動 · ドラッグ/ホイール: スクロール · Ctrl+ホイール: 拡大 · Space: 再生 · ←/→: 前後の小節</span>`;

readColors(); resize();
</script>
